version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models

  dashboard:
    image: python:3.10-slim
    working_dir: /app
    command: streamlit run dashboard/dashboard.py --server.port 8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - api